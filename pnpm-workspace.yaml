packages:
  - 'packages/*'
  - 'apps/examples/*'
  - 'apps/docs'
  - 'fixtures/*'
# Keep Tailwind v4's PostCSS plugin out of the hoisted virtual store. It is
# pulled in transitively by @nuxt/ui (docs app, legitimately on Tailwind v4),
# and pnpm otherwise hoists it into node_modules/.pnpm/node_modules where
# vue-lynx's `require.resolve('@tailwindcss/postcss')` finds it and warns that
# v4 is incompatible with rsbuild-plugin-tailwindcss / @lynx-js/tailwind-preset.
# The Lynx demo apps are all on Tailwind v3, so the warning is a false positive.
# @nuxt/ui still resolves the plugin via its own dependency link, so excluding
# it from hoisting does not affect the docs build.
hoistPattern:
  - '*'
  - '!@tailwindcss/postcss'
# Per-dependency allowlist for install/build (lifecycle) scripts. Everything is
# blocked by default (pnpm 10+) so a poisoned dependency cannot auto-execute a
# postinstall to harvest secrets. Only the native packages that genuinely need a
# build step are `true`; everything else is explicitly `false`. Every package
# with a build script must appear here, otherwise pnpm fails install with
# ERR_PNPM_IGNORED_BUILDS. core-js' postinstall is only a donation notice and
# vue-demi's switch is a no-op under Vue 3, so both are denied. Keep this minimal.
allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  core-js: false
  esbuild: true
  sharp: true
  vue-demi: false
# 0.5.1's worklet-loader-mt registration scan chokes on comments inside worklet
# bodies; patch makes findBalancedEnd comment-aware. Drop when upstream #287
# (AST-span extraction) ships.
patchedDependencies:
  '@changesets/cli@2.31.0': patches/@changesets__cli@2.31.0.patch
  '@lynx-js/react@0.116.5': patches/@lynx-js__react@0.116.5.patch
  vue-lynx@0.5.1: patches/vue-lynx@0.5.1.patch
minimumReleaseAgeExclude:
  - nuxt-schema-org@6.2.3
  # 0.5.1 (2026-07-17) is younger than the 7-day gate. Its `findBalancedEnd`
  # extraction bug (comments in worklet bodies) is fixed by our local patch in
  # patches/ until upstream #287 ships — see
  # docs/upstream/vue-lynx-mt-worklet-import-issue.md addendum.
  - vue-lynx@0.5.1
