name: Type Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Build core first so its `dist/*.d.ts` exist — rslib emits no types
      # (`dts: false`); `build` runs the separate `build-types` (vue-tsc) step.
      - run: pnpm --filter @vyui/core build
      - run: pnpm --filter @vyui/core typecheck
      # Type-lock: fixture-consumer resolves @vyui/core's PUBLISHED dist types,
      # so a regression in the emitted surface fails here. Must run after build.
      - run: pnpm --filter @vyui/fixture-consumer typecheck
