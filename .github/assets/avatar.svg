<!-- Square avatar tile (render at 512×512 for GitHub org/profile upload).
     The "Vy" mark mirrors apps/docs/public/favicon.svg, inverted onto the
     brand near-black so it reads at small sizes on light and dark UIs.
     GitHub applies its own corner rounding — keep the tile square. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#17191c" />
  <text
    x="256"
    y="352"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="352"
    font-weight="700"
    text-anchor="middle"
    fill="#ffffff"
    letter-spacing="-8"
  >Vy</text>
</svg>
